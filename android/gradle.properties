# Java 목표는 11 이라 Gradle 이 "JVM 목표 불일치"로 멈춘다(2026-09-02 실측). 둘 다
# 안드로이드 런타임에서 문제없이 섞이므로 검사만 경고로 낮춘다. 플러그인이 목표를
# 올리면 이 줄은 지운다.
kotlin.jvm.target.validation.mode=warning
