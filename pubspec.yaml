name: vica_supervisor
description: VICA robot supervisor app for map, location, and robot status management.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

  # 폰트를 앱에 넣는다. 이름만 지정하고 파일을 넣지 않으면 그 기기에 같은 이름의
  # 폰트가 깔려 있을 때만 한글이 보인다. Jetson에는 fonts-nanum이 깔려 있어 넘어갔지만
  # APK나 다른 PC에서는 한글이 전부 네모(□)로 나온다.
  #
  # NanumGothic은 SIL Open Font License 1.1이라 재배포할 수 있다. 라이선스 전문을
  # assets/fonts/NanumGothic-LICENSE.txt에 함께 둔다 — OFL이 요구한다.
  # Noto Sans CJK도 후보였지만 굵기당 19 MB라 9 MB인 이쪽을 골랐다.
  fonts:
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic.ttf
          weight: 400
        - asset: assets/fonts/NanumGothicBold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
